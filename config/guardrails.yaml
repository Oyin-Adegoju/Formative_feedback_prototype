# guardrails.yaml — centrale beleidsbeschrijving voor de INFIRFS feedback-pipeline
# versie: 0.2.0  (prototype-v2 — twee strategieën, Qwen-gedreven kwaliteit)
#
# LET OP: dit bestand wordt NERGENS door de code ingeladen. Het beschrijft het
# BELEID en de architectuur (voor documentatie / rapport), niet de runtime-config.
# De echte runtime-config zit in:
#   - environment variables: LLM_MODEL, LLM_BASE_URL
#   - constanten in src/llm/llm_client.py
#       _DEFAULT_MODEL = "qwen2.5:14b", _DEFAULT_MAX_TOKENS = 1024,
#       _DEFAULT_TEMPERATURE = 0.15
#   - de prompt-bestanden onder prompts/
# Een wijziging hier verandert dus geen gedrag; houd het synchroon met de code
# omdat het het evaluatierapport voedt.

# =============================================================================
# 1. PROJECT
# =============================================================================
project:
  naam: INFIRFS Formatieve Feedback Assistent
  versie: "0.2.0"
  fase: prototype-v2
  scope: requirementsdeel INFIRFS-rubric
  doelgroep: HBO-ICT studenten (First Full Stack)
  omgeving: lokaal — geen externe API-calls, geen cloud-opslag

# =============================================================================
# 2. MODEL & STRATEGIEËN
# =============================================================================
model:
  # De pipeline kent TWEE evidence-strategieën die hetzelfde model-merk (Qwen2.5)
  # gebruiken maar verschillen in grootte en in hoeveel context ze krijgen.
  # Het model wordt gekozen via de LLM_MODEL environment-variabele; de server via
  # LLM_BASE_URL (OpenAI-compatibel, standaard Ollama op http://localhost:11434/v1).
  strategieen:
    14b:
      id: qwen2.5:14b
      evidence: getrimd            # CAPS-gecureerde, budget-begrensde evidence (packet_builder)
      context: klein               # daarom trimmen
    32b:
      id: qwen2.5-32b-ctx          # Ollama-model met PARAMETER num_ctx 32768
      evidence: full-content       # volledige, niet-afgekapte sectietekst per criterium
      context: groot (num_ctx 32768)

  defaults_in_llm_client:
    max_tokens: 1024               # quality-stap verhoogt dit naar 2048
    temperature: 0.15

  # Qwen heeft TWEE rollen in de pipeline (geen van beide bepaalt het stoplicht):
  rollen_van_qwen:
    - stage_A_quality:
        prompt: prompts/qwen_quality/quality_diagnostics_all_criteria_v3.txt
        taak: per criterium een inhoudelijk kwaliteitsoordeel geven
               (criterion_judgement = strong | mixed | weak + diagnostics laag/middel/hoog)
        invoer: de CAPS-handoff (extractie + evidence; bij 32B de volledige sectietekst)
    - stage_B_feedback:
        prompt: prompts/feedback_writer_v5.txt
        taak: narratieve student- en docentfeedback schrijven op basis van de merge-output
        invoer: merged_feedback_input (Qwen-oordeel + evidence-referenties)

  verboden:
    - stoplicht_bepalen            # stoplicht volgt deterministisch uit de merge-stap (Python)
    - score_noemen                 # geen cijfer / puntentotaal in de output
    - statuslabel_in_tekst         # missing/partial/sufficient/strong niet letterlijk in feedback

  mag_wel:
    - kwaliteit_diagnosticeren      # stage A: strong/mixed/weak per criterium
    - feedbacktekst_schrijven       # stage B: formatieve narratieve feedback
  # Noot: in de full-content (32B) strategie ZIET de quality-stap wél de volledige
  # documenttekst per criterium — dat is bewust (de oude regel "Qwen ziet nooit
  # ruwe tekst" geldt niet meer voor stage A).

# =============================================================================
# 3. ROLLEN
# =============================================================================
rollen:
  docent:
    beschrijving: Beoordelaar met volledig inzicht in het resultaat
    mag_zien:
      - final_stoplight
      - criterion_judgement         # per criterium: strong / mixed / weak (Qwen)
      - diagnostics                 # per dimensie: laag / middel / hoog
      - evidence                    # tekstfragmenten waarop de diagnose is gebaseerd
      - feedback_tekst
      - manual_review_vlag
    mag_niet:
      - anonimisering_uitschakelen

  student:
    beschrijving: Ontvanger van formatieve feedback — geen inzicht in interne diagnose
    mag_zien:
      - feedback_tekst
      - final_stoplight             # groen / geel / rood als globale indicatie
    mag_niet:
      - criterion_judgement         # interne kwaliteitsoordelen
      - diagnostics
      - evidence
      - manual_review_vlag

  beheerder:
    beschrijving: Technisch beheerder van de lokale installatie
    mag_zien: [alle_logs, configuratiebestanden, parse_reports]
    mag_doen: [logging_configureren, model_configureren, anonimisering_configureren]
    mag_niet: [stoplicht_overschrijven]

# =============================================================================
# 4. TRANSPARANTIE
# =============================================================================
transparantie:
  stoplicht_motivatie_verplicht: true   # bij rood of geel altijd uitleggen waarom
  feedback_bevat_geen_score: true       # output bevat nooit een numeriek oordeel
  modelversie_in_log: true              # welk model (14B/32B) welke feedback gaf
  pipeline_stap_in_log: true            # parse → anonimiseer → caps/handoff → quality → merge → feedback

# =============================================================================
# 5. RUBRIC
# =============================================================================
rubric:
  naam: INFIRFS requirements-rubric
  onderdeel: requirementsdeel (prototype-scope)
  beschrijving: >
    Vijf ontvankelijkheidscriteria waaraan een INFIRFS requirements-document
    minimaal moet voldoen. De interne criterium-keys staan hieronder; de
    drempels zijn rubric-beleid en worden NIET meer mechanisch via een telling
    afgedwongen (CAPS levert geen counts meer; Qwen beoordeelt de kwaliteit).

  criteria:
    - key: beperking
      display_name: "Beperking & deskresearch"
      beschrijving: >
        Het document beschrijft een gekozen beperking van het project én
        onderbouwt die keuze met deskresearch (literatuur, bestaande systemen
        of vergelijkbare oplossingen).

    - key: stakeholders
      display_name: Stakeholders
      beschrijving: >
        Het document identificeert minstens 4 stakeholders, elk met een
        beschreven belang én invloed.
      drempel_voldoende: 4            # rubric-beleid (richtlijn, niet mechanisch geteld)
      drempel_sterk: 6

    - key: requirements
      display_name: Requirements
      beschrijving: >
        Het document bevat aantoonbare, toetsbare requirements
        (functioneel en/of niet-functioneel), bij voorkeur met MoSCoW-prioritering.
      drempel_voldoende: 15           # rubric-beleid (richtlijn, niet mechanisch geteld)
      drempel_sterk: 25

    - key: taalkeuze
      display_name: "Taalkeuze & consequenties"
      beschrijving: >
        Het document beschrijft de taalkeuze van de webshop als ontwerpbeslissing
        én benoemt de consequenties van die keuze (bereik, vertaling, onderhoud,
        begrijpelijkheid, toegankelijkheid).

    - key: security
      display_name: Security
      beschrijving: >
        Het document beschrijft minstens 1 concreet security-element
        (authenticatie, autorisatie, encryptie, AVG/privacy, OWASP) en koppelt
        dat aan een risico en de webshop-context.
      drempel_voldoende: 1
      drempel_sterk: 3

# =============================================================================
# 6. CAPS  (extractie + structuur — GEEN kwaliteitsoordeel)
# =============================================================================
caps:
  # CAPS geeft GEEN cijfer en GEEN gezaghebbende status meer. Het heeft twee
  # beschrijvende rollen:
  #   1. structuur-check  — zijn de verwachte secties aanwezig? (puur informatief,
  #                         zit NIET in de handoff)
  #   2. evidence-extractie — per criterium de relevante tekst in een vaste
  #                           handoff-vorm zetten.
  engine: src/caps/caps.py
  levert: handoff (extractie)        # geen status/stoplight/hidden_score in de handoff
  counts: geneutraliseerd            # het count-veld in de handoff is altijd null

  # Twee handoff-bouwers (zie §12):
  handoff_bouwers:
    getrimd:      src/feedback/handoff.py        # via packet_builder (14B-strategie)
    full_content: src/feedback/full_content.py   # volledige sectietekst (32B-strategie)

# =============================================================================
# 7. STOPLICHT  (deterministisch in de merge-stap — Python, niet Qwen, niet CAPS)
# =============================================================================
stoplicht:
  engine: src/feedback/merge_builder.py

  # Basis: Qwen's per-criterium oordeel mapt 1-op-1 naar een criterium-stoplicht.
  mapping_judgement_naar_stoplicht:
    strong: green
    mixed: yellow
    weak: red

  # Daarna twee deterministische correcties:
  correcties:
    - manual_review_downgrade: >
        Een criterium dat groen is maar door Qwen op manual_review=true is gezet,
        wordt afgewaardeerd naar geel. (Nooit omhoog, nooit geel→rood.)
    - count_floor: >
        Alleen voor stakeholders en requirements: als de telling objectief te laag
        is, wordt het criterium-stoplicht geforceerd naar rood, ongeacht Qwen.

  document_stoplicht:
    regel: het strengste criterium bepaalt het document
    rood: een of meer criteria zijn rood
    geel: geen rood, maar minstens één geel
    groen: alle criteria groen
  prioriteit: rood > geel > groen
  # Geel is nu een ECHTE uitkomst (mixed-oordeel of afgewaardeerd groen),
  # niet langer "gereserveerd voor later".

# =============================================================================
# 8. HANDOFF- & QUALITY-CONTRACT  (vervangt het oude scorecard/hidden_score-model)
# =============================================================================
contracten:
  # 8a. CAPS-handoff: de enige beoordelingsinput voor de quality-stap.
  handoff_per_criterium:
    - count               # ALTIJD null (niet meer in gebruik)
    - notes               # extractie-/dekkingsnotities
    - missing_signals     # verwachte signalen die ontbreken
    - evidence_items      # geselecteerde blokken (block_id, page_no, block_type,
                          #   heading_path, excerpt; getrimde variant heeft extra
                          #   metadata, full-content variant bewust lean)
  handoff_bevat_niet: [hidden_score, status, stoplicht, studentnaam, studentnummer]

  # 8b. Quality-output (stage A): de enige beoordelingsinput voor de feedback-stap.
  quality_output_per_criterium:
    criterion_judgement: [strong, mixed, weak]
    diagnostics_waarden: [laag, middel, hoog]
    diagnostics_dimensies:
      beperking:    [concreteness, research_support, case_relevance, impact_on_requirements]
      stakeholders: [stakeholder_relevance, interest_quality, influence_quality, context_link]
      requirements: [concreteness, testability, relevance, explanation_quality, priority_logic, classification_quality]
      taalkeuze:    [explicit_choice, target_group_fit, consequence_quality, design_decision_clarity]
      security:     [measure_quality, risk_link, case_relevance, technical_correctness, explanation_quality]
    overige_velden: [strengths, weaknesses, manual_review, manual_review_reason, reason]

  # 8c. Feedback-output (stage B):
  feedback_output_contract:
    type: feedback_tekst
    bevat_geen: [cijfer, score, stoplicht, criterium_status_labels]
    toon: formatief_en_constructief
    taal: nl

# =============================================================================
# 9. MANUAL_REVIEW
# =============================================================================
manual_review:
  # Inhoudelijke manual-review is Qwen-gedreven: de quality-stap zet per criterium
  # manual_review=true op basis van dunne/onzekere/tegenstrijdige evidence en
  # missing_signals. De merge verzamelt dit in criteria_requiring_extra_review.
  bron: stage_A_quality (Qwen)

  # Infrastructurele triggers blijven op pipeline-niveau (parse-fouten, lege docs).
  infra_triggers:
    - parse_status is "empty" of "error"
    - document te klein om betrouwbaar te beoordelen
  actie_bij_infra_trigger:
    stoplicht: rood
    feedback_voor_student: >
      Je document kon niet volledig automatisch worden beoordeeld.
      Een docent zal je document handmatig beoordelen.
    log_reden: true

# =============================================================================
# 10. LOGGING
# =============================================================================
logging:
  niveau: info
  wel_loggen:
    - doc_id                # anonieme documentidentificatie
    - tijdstip              # ISO 8601
    - pipeline_stap         # parse / anonimiseer / caps / quality / merge / feedback
    - model_id              # 14B of 32B
    - final_stoplight
    - criterion_judgement   # per criterium strong/mixed/weak
    - manual_review_vlag
    - parse_warnings
  niet_loggen:
    - studentnaam
    - studentnummer
    - email
    - ruwe_documenttekst

# =============================================================================
# 11. ANONIMISERING
# =============================================================================
anonimisering:
  # Anonimisering vindt plaats VOORDAT er iets gelogd of aan het model
  # doorgegeven wordt. Volgorde is een harde systeemeis.
  volgorde: voor_logging_en_voor_modelcall
  engine: src/privacy/anonymizer.py
  catalog: data/reference/people_catalog.json   # gitignored (bevat namen)

  verwijder_patronen:
    - studentnummer          # bijv. S1234567
    - email
    - studentnaam_titelblok  # naam in de eerste blokken (best-effort, via catalog)

  doc_id_strategie: >
    doc_id is een hash van het bron-pad (eerste 8 tekens). Niet gekoppeld aan een
    studentnummer in opgeslagen bestanden.
  waarschuwing: best_effort_bij_gefragmenteerde_tabelinhoud

# =============================================================================
# 12. EVIDENCE-SELECTIE  (twee strategieën)
# =============================================================================
evidence_selectie:
  # Sectie-identiteit is nu de PRIMAIRE toelatingsautoriteit (omgekeerd t.o.v. de
  # oude "heading_path onbetrouwbaar, scan alles"-aanpak). src/feedback/
  # section_family.py bepaalt op kop-niveau of een blok bij een criterium hoort.
  toelating: heading_only (section_family — precision-first)
  cross_sectie_uitzondering: >
    Alleen taalkeuze en security kennen een trefwoord-fallback (choice-/security-
    termen) buiten een eigen sectie, omdat die zelden een eigen kop hebben.

  strategieen:
    getrimd_14b:
      module: src/feedback/packet_builder.py
      kenmerk: >
        budget per criterium, coverage-tiling en ontdubbeling; evidence-items met
        rijke metadata (focused_excerpt, signal_class, evidence_strength, …).
      reden: het kleine contextvenster van de 14B vereist een gerichte selectie.
    full_content_32b:
      module: src/feedback/full_content.py
      kenmerk: >
        de volledige, niet-afgekapte tekst van elk in-sectie blok (incl. volledige
        tabellen); lean evidence-items (geen metadata, want die zou bij volledige
        tekst misleidend zijn). Het model oordeelt puur op de tekst.
      reden: de 32B met num_ctx 32768 heeft geen trimming nodig.

# =============================================================================
# 13. PARSER_CONTRACT
# =============================================================================
parser_contract:
  # Minimale, stabiele verwachtingen over parser-output (BlockDict, zie
  # src/caps/models.py). Bewust beperkt zodat parserverbeteringen de pipeline
  # niet breken.
  verplichte_velden_per_blok:
    - block_id       # unieke string-identifier binnen het document
    - block_type     # zie block_types hieronder
    - page_no        # paginanummer (integer, 1-gebaseerd)
    - text           # tekstinhoud (string; kan leeg zijn)
    - heading_path   # lijst van strings; kan leeg zijn

  optionele_velden_per_blok:
    - is_front_matter   # bool — titelblad/inhoudsopgave e.d.
    - is_appendix       # bool
    - table_meta        # header_row + cells bij block_type == "table"
    - token_estimate    # ruwe tokenschatting

  block_types: [heading, paragraph, table, bullet, caption, front_matter, noise, template]

  stabiele_invarianten:
    - Elk document heeft een doc_id (string).
    - Elk document heeft een blocks-lijst (kan leeg zijn bij lege PDF).
    - block_id is uniek binnen één document.
    - text is altijd een string, nooit null.

  geen_garanties:
    - heading_path is volledig of correct gevuld
    - Alle headings in het document worden herkend
    - Tabelinhoud is niet gefragmenteerd over meerdere blokken
    - Documentstructuur weerspiegelt de visuele lay-out exact
